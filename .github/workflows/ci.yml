name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck hutch test/*.sh
      - name: unit tests
        run: bash test/run.sh

  unit-macos:
    # The system bash on macOS is 3.2; hutch must keep working with it.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: unit tests (bash 3.2)
        run: /bin/bash test/run.sh

  e2e:
    # Builds the images on x86-64 and runs export and verify against a throwaway project; no model is called.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: end-to-end
        run: bash test/e2e.sh

  e2e-gvisor:
    # The same end-to-end test with every sandbox and check under gVisor (runtime=runsc).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" |
            sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -q && sudo apt-get install -y -q runsc
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{range $k, $v := .Runtimes}}{{println $k}}{{end}}' | grep -x runsc
      - name: end-to-end under gVisor
        run: HUTCH_RUNTIME=runsc bash test/e2e.sh

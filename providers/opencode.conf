# OpenCode Go (https://opencode.ai/go). key=value lines, read by hutch, never executed. A provider of your own goes in
# ~/.hutch/providers/<name>.conf with the same keys and is chosen with HUTCH_PROVIDER=<name>.
# The model API: the gate forwards to this https origin and adds the key there; the sandbox never holds the key.
upstream=https://opencode.ai
# The keychain item (macOS) or Secret Service item (Linux) that holds the key; HUTCH_API_KEY overrides it.
key_item=opencode-go
# Path prefixes the gate forwards, space-separated; every other path gets 403.
paths=/inference/go/anthropic/v1/ /zen/go/v1/
# Base path of the Anthropic Messages API, for the Claude Code agent (HUTCH_AGENT=claude). Empty: not supported.
claude_base=/inference/go/anthropic
# Base path and provider id for the opencode agent (HUTCH_AGENT=opencode); opencode ships this provider, so it works
# offline. Empty: not supported.
opencode_base=/zen/go/v1
opencode_provider=opencode-go
# Model table per HUTCH_KIND, relative to this file.
models=../models/opencode.tsv
# Context size after which Claude Code compacts; empty keeps its default. HUTCH_COMPACT_WINDOW overrides it.
compact_window=
